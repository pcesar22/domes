// Portable semantic contract for the current DOMES peer/drill messages.
//
// This schema is the semantic type authority shared by nanopb, prost, and
// Dart. ESP-NOW continues to carry the fixed Legacy-V1 bytes produced by the
// production peerDrillCodec; protobuf wire bytes are never transmitted.
syntax = "proto3";
package domes.peer_drill;

// Role at the peer protocol boundary. Discovery messages are role-neutral;
// drill controls originate from a master and drill results from a slave.
enum PeerRole {
    PEER_ROLE_UNSPECIFIED = 0;
    PEER_ROLE_MASTER = 1;
    PEER_ROLE_SLAVE = 2;
}

// Existing feedback bitmask values. Values outside this enum are invalid.
enum FeedbackMode {
    FEEDBACK_MODE_NONE = 0;
    FEEDBACK_MODE_LED = 1;
    FEEDBACK_MODE_AUDIO = 2;
    FEEDBACK_MODE_LED_AND_AUDIO = 3;
}

message Beacon {}
message Ping {}
message Pong {}
message JoinGame {}
message StopAll {}

message ArmTouch {
    // Round-scoped messages require a non-zero token.
    fixed32 round_token = 1;
    uint32 timeout_ms = 2;
    FeedbackMode feedback_mode = 3;
}

message SetColor {
    // Each channel must fit the Legacy-V1 uint8 representation (0..255).
    uint32 red = 1;
    uint32 green = 2;
    uint32 blue = 3;
}

message SimulateTouch {
    // Token must be non-zero; current hardware pad indices are 0..3.
    fixed32 round_token = 1;
    uint32 pad_index = 2;
}

message TouchEvent {
    // Token must be non-zero; current hardware pad indices are 0..3.
    fixed32 round_token = 1;
    uint32 reaction_time_us = 2;
    uint32 pad_index = 3;
}

message TimeoutEvent {
    // Round-scoped messages require a non-zero token.
    fixed32 round_token = 1;
}

message PeerMessage {
    // These field numbers intentionally equal the current Legacy-V1 type byte.
    // The generated oneof discriminator is therefore the single message-type
    // authority for both semantic protobuf and compatibility-codec consumers.
    oneof payload {
        // Role-neutral discovery.
        Beacon beacon = 1;
        Ping ping = 2;
        Pong pong = 3;

        // Master -> slave drill controls.
        JoinGame join_game = 16;
        ArmTouch arm_touch = 17;
        SetColor set_color = 18;
        StopAll stop_all = 19;
        SimulateTouch simulate_touch = 20;

        // Slave -> master drill results.
        TouchEvent touch_event = 32;
        TimeoutEvent timeout_event = 33;
    }

    reserved 4 to 15, 21 to 31;

    // Semantic compatibility metadata. These fields do not add bytes to the
    // unchanged Legacy-V1 ESP-NOW packet. For PONG, timestamp_us echoes the
    // corresponding PING timestamp; otherwise it is the sender's local time.
    uint32 protocol_version = 256; // Validators accept exactly 1.
    bytes sender_mac = 257;        // Validators require exactly six bytes.
    fixed32 timestamp_us = 258;
}
