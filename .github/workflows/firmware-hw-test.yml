name: Hardware Tests

on:
  pull_request:
    types: [labeled, synchronize, reopened]

  workflow_dispatch:
    inputs:
      ports:
        description: 'At least two comma-separated ports; leave empty to auto-detect NFF CP2102N/ttyUSB runtime ports'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

# The self-hosted runner must be Actions Runner v2.327.1 or newer for the
# pinned Node 24 actions used below. Only one hardware test can run at a time.
# Never interrupt a flash or OTA that is already in progress.
concurrency:
  group: hardware-test-queue
  cancel-in-progress: false

env:
  EXPECTED_IDF_VERSION: ESP-IDF v5.4.4
  EXPECTED_RUST_VERSION: rustc 1.92.0
  MINIMUM_ACTIONS_RUNNER_VERSION: 2.327.1
  SERIAL_PORTS: ${{ github.event.inputs.ports || '' }}

jobs:
  hardware-test:
    name: On-Device Tests
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60

    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'hw-test') ||
        ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
         contains(github.event.pull_request.labels.*.name, 'hw-test')))) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Verify Actions Runner version
        run: |
          runner_root=$(cd "$RUNNER_TEMP/../.." && pwd)
          runner_binary="$runner_root/bin/Runner.Listener"
          if [[ ! -x "$runner_binary" ]]; then
            echo "::error::Cannot determine the self-hosted Actions Runner version"
            exit 1
          fi

          runner_version=$(
            "$runner_binary" --version 2>/dev/null |
              tr -d '\r' |
              grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' |
              tail -n 1 || true
          )
          if [[ -z "$runner_version" ]]; then
            echo "::error::Actions Runner returned an invalid version"
            exit 1
          fi
          if [[ $(printf '%s\n' "$MINIMUM_ACTIONS_RUNNER_VERSION" "$runner_version" |
            sort -V | head -n 1) != "$MINIMUM_ACTIONS_RUNNER_VERSION" ]]; then
            echo "::error::Actions Runner $runner_version is too old; install $MINIMUM_ACTIONS_RUNNER_VERSION or newer"
            exit 1
          fi
          echo "Actions Runner $runner_version satisfies the minimum version"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Detect devices
        id: detect
        run: |
          echo "=== Detecting connected DOMES devices ==="

          PORTS=()
          if [[ -n "$SERIAL_PORTS" ]]; then
            IFS=',' read -ra requested_ports <<< "$SERIAL_PORTS"
            for port in "${requested_ports[@]}"; do
              port="${port#"${port%%[![:space:]]*}"}"
              port="${port%"${port##*[![:space:]]}"}"
              [[ -n "$port" ]] && PORTS+=("$port")
            done
          else
            shopt -s nullglob
            # NFF boards use CP2102N for flashing, config, and serial OTA.
            # Native ESP32-S3 ttyACM ports are console/JTAG and are intentionally excluded.
            candidates=(
              /dev/serial/by-id/*CP2102N*
              /dev/ttyUSB*
            )
            declare -A seen_devices=()
            for port in "${candidates[@]}"; do
              canonical=$(readlink -f -- "$port")
              if [[ ! -c "$canonical" || -n "${seen_devices[$canonical]+present}" ]]; then
                continue
              fi

              properties=$(udevadm info --query=property --name "$canonical" 2>/dev/null || true)
              if ! grep -qx 'ID_VENDOR_ID=10c4' <<< "$properties" ||
                 ! grep -qx 'ID_MODEL_ID=ea60' <<< "$properties" ||
                 ! grep -Eq '^ID_MODEL=.*CP2102N' <<< "$properties"; then
                echo "Skipping non-NFF tty device: $port -> $canonical"
                continue
              fi

              seen_devices[$canonical]=1
              PORTS+=("$port")
            done
          fi

          if ((${#PORTS[@]} < 2)); then
            echo "::error::Hardware validation requires two NFF CP2102N runtime ports; found ${#PORTS[@]}"
            ls -la /dev/serial/by-id/*CP2102N* /dev/ttyUSB* 2>/dev/null || true
            exit 1
          fi

          echo "Detected ${#PORTS[@]} device(s):"
          declare -A validated_devices=()
          for port in "${PORTS[@]}"; do
            if [[ ! -c "$port" ]]; then
              echo "::error::Serial port is missing or is not a character device: $port"
              exit 1
            fi
            canonical=$(readlink -f -- "$port")
            if [[ -n "${validated_devices[$canonical]+present}" ]]; then
              echo "::error::Duplicate serial device selected through multiple paths: $port"
              exit 1
            fi

            properties=$(udevadm info --query=property --name "$canonical" 2>/dev/null || true)
            if ! grep -qx 'ID_VENDOR_ID=10c4' <<< "$properties" ||
               ! grep -qx 'ID_MODEL_ID=ea60' <<< "$properties" ||
               ! grep -Eq '^ID_MODEL=.*CP2102N' <<< "$properties"; then
              echo "::error::Unsupported serial device; expected an NFF CP2102N bridge: $port"
              exit 1
            fi

            validated_devices[$canonical]=1
            echo "  OK: $port -> $canonical"
          done

          # Export for subsequent steps
          PORT_LIST=$(IFS=','; echo "${PORTS[*]}")
          {
            echo "ports=$PORT_LIST"
            echo "count=${#PORTS[@]}"
            echo "primary=${PORTS[0]}"
            if ((${#PORTS[@]} >= 2)); then
              echo "secondary=${PORTS[1]}"
              echo "multi=true"
            else
              echo "secondary="
              echo "multi=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build firmware
        id: firmware_build
        working-directory: firmware/domes
        run: |
          # shellcheck source=/dev/null
          . "$HOME/esp/esp-idf/export.sh"
          actual_idf_version=$(idf.py --version)
          echo "$actual_idf_version"
          if [[ "$actual_idf_version" != "$EXPECTED_IDF_VERSION" ]]; then
            echo "::error::Expected $EXPECTED_IDF_VERSION, found $actual_idf_version"
            exit 1
          fi
          normal_sdkconfig="${RUNNER_TEMP:-/tmp}/domes-hw-sdkconfig"
          ota_sdkconfig="${RUNNER_TEMP:-/tmp}/domes-hw-ota-sdkconfig"
          rollback_sdkconfig="${RUNNER_TEMP:-/tmp}/domes-hw-rollback-sdkconfig"
          rm -rf build build-ota build-rollback
          rm -f "$normal_sdkconfig" "$ota_sdkconfig" "$rollback_sdkconfig"

          baseline_version="v0.0.0-0-g${GITHUB_SHA:0:12}"
          idf.py -B build \
            -D "IDF_TARGET=esp32s3" \
            -D "SDKCONFIG=$normal_sdkconfig" \
            -D DOMES_VERSION_OVERRIDE="$baseline_version" \
            build
          ota_version="v0.0.0-1-g${GITHUB_SHA:0:12}"
          idf.py -B build-ota \
            -D "IDF_TARGET=esp32s3" \
            -D "SDKCONFIG=$ota_sdkconfig" \
            -D DOMES_VERSION_OVERRIDE="$ota_version" \
            build
          rollback_version="v0.0.0-2-g${GITHUB_SHA:0:12}"
          idf.py -B build-rollback \
            -D "IDF_TARGET=esp32s3" \
            -D "SDKCONFIG=$rollback_sdkconfig" \
            -D DOMES_VERSION_OVERRIDE="$rollback_version" \
            -D DOMES_FORCE_OTA_VERIFY_FAILURE=ON \
            build
          python - "$baseline_version" "$ota_version" "$rollback_version" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          expected_versions = dict(
              zip(("build", "build-ota", "build-rollback"), sys.argv[1:], strict=True)
          )
          assert len(set(expected_versions.values())) == 3, expected_versions

          for build_dir, expected_version in expected_versions.items():
              assert 0 < len(expected_version.encode("ascii")) <= 31, expected_version
              description = json.loads(
                  Path(build_dir, "project_description.json").read_text()
              )
              assert description["project_version"] == expected_version, description

              config = json.loads(Path(build_dir, "config", "sdkconfig.json").read_text())
              assert config["BOOTLOADER_APP_ROLLBACK_ENABLE"] is True, build_dir

              image_info = subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "esptool",
                      "--chip",
                      "esp32s3",
                      "image_info",
                      "--version",
                      "2",
                      str(Path(build_dir, "domes.bin")),
                  ],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout
              app_versions = [
                  line.removeprefix("App version: ")
                  for line in image_info.splitlines()
                  if line.startswith("App version: ")
              ]
              assert app_versions == [expected_version], (build_dir, app_versions)

          flash_args = Path("build", "flash_args").read_text().splitlines()
          assert "0x20000 domes.bin" in flash_args, flash_args
          PY
          if [[ -n "$(git status --porcelain -- dependencies.lock)" ]]; then
            echo "::error::ESP-IDF rewrote firmware/domes/dependencies.lock"
            git diff -- dependencies.lock
            exit 1
          fi
          (
            cd build
            python -m esptool --chip esp32s3 merge_bin \
              -o domes-factory.bin @flash_args
            python -m esptool --chip esp32s3 image_info domes-factory.bin
          )
          echo "Firmware built successfully"
          echo "Binary size: $(stat -c%s build/domes.bin) bytes"
          echo "OTA test binary size: $(stat -c%s build-ota/domes.bin) bytes"
          echo "Rollback test binary size: $(stat -c%s build-rollback/domes.bin) bytes"
          {
            echo "baseline_version=$baseline_version"
            echo "ota_version=$ota_version"
            echo "rollback_version=$rollback_version"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.92.0

      - name: Build domes-cli
        id: cli_build
        working-directory: tools/domes-cli
        run: |
          actual_rust_version=$(rustc --version)
          echo "$actual_rust_version"
          if [[ "$actual_rust_version" != "$EXPECTED_RUST_VERSION "* ]]; then
            echo "::error::Expected $EXPECTED_RUST_VERSION, found $actual_rust_version"
            exit 1
          fi
          cargo build --locked --release
          echo "CLI built successfully"

      - name: Flash all devices
        id: flash
        working-directory: firmware/domes
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          # shellcheck source=/dev/null
          . "$HOME/esp/esp-idf/export.sh"

          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          FAILED=0

          for index in "${!PORTS[@]}"; do
            port="${PORTS[$index]}"
            echo "=== Erasing and flashing $port ==="
            if ! python -m esptool --chip esp32s3 --port "$port" erase_flash; then
              echo "::error::Failed to erase $port"
              FAILED=$((FAILED + 1))
              continue
            fi
            if ((index == 0)); then
              flash_command=(python -m esptool --chip esp32s3 --port "$port" \
                write_flash 0x0 build/domes-factory.bin)
            else
              flash_command=(idf.py -p "$port" flash)
            fi
            if "${flash_command[@]}"; then
              echo "Flashed $port successfully"
            else
              echo "::error::Failed to flash $port"
              FAILED=$((FAILED + 1))
            fi
          done

          echo "Waiting for devices to boot..."
          sleep 15

          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED device(s) failed to flash"
            exit 1
          fi

      - name: Provision deterministic pod identities
        id: identity
        env:
          BASELINE_VERSION: ${{ steps.firmware_build.outputs.baseline_version }}
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          # shellcheck source=/dev/null
          . "$HOME/esp/esp-idf/export.sh"
          CLI=tools/domes-cli/target/release/domes-cli
          IFS=',' read -ra PORTS <<< "$PORT_LIST"

          # A factory-programming test is only meaningful when prior NVS state
          # cannot leak into the result.
          before_boot_counts=()
          for port in "${PORTS[@]}"; do
            info=$("$CLI" --port "$port" system info)
            printf '%s\n' "$info"
            if ! grep -Fq "Firmware:   $BASELINE_VERSION" <<< "$info"; then
              echo "::error::Factory image version does not match $BASELINE_VERSION on $port"
              exit 1
            fi
            if ! grep -Eq 'Pod ID:[[:space:]]+not set$' <<< "$info"; then
              echo "::error::Factory erase did not clear the persisted pod ID on $port"
              exit 1
            fi
            boot_count=$(awk '/Boot count:/ {print $3}' <<< "$info")
            if [[ ! "$boot_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Factory image reported an invalid boot count on $port"
              exit 1
            fi
            before_boot_counts+=("$boot_count")

            self_test=$("$CLI" --port "$port" system self-test)
            printf '%s\n' "$self_test"
            if ! grep -Eq 'Running App.*PASS.*ota_0,' <<< "$self_test"; then
              echo "::error::Factory image is not running from ota_0 on $port"
              exit 1
            fi
          done

          for index in "${!PORTS[@]}"; do
            port="${PORTS[$index]}"
            pod_id=$((index + 1))
            "$CLI" --port "$port" system set-pod-id "$pod_id"
            python -m esptool --chip esp32s3 --port "$port" run
          done
          sleep 10

          provisioned_boot_counts=()
          for index in "${!PORTS[@]}"; do
            port="${PORTS[$index]}"
            expected_id=$((index + 1))
            info=$("$CLI" --port "$port" system info)
            printf '%s\n' "$info"
            if ! grep -Fq "Firmware:   $BASELINE_VERSION" <<< "$info"; then
              echo "::error::Provisioning changed the running firmware on $port"
              exit 1
            fi
            if ! grep -Eq "Pod ID:[[:space:]]+$expected_id$" <<< "$info"; then
              echo "::error::Expected pod ID $expected_id on $port"
              exit 1
            fi
            boot_count=$(awk '/Boot count:/ {print $3}' <<< "$info")
            if [[ ! "$boot_count" =~ ^[1-9][0-9]*$ ]] ||
               ((boot_count <= before_boot_counts[index])); then
              echo "::error::Pod identity reboot did not advance the boot count on $port"
              exit 1
            fi
            provisioned_boot_counts+=("$boot_count")
          done
          echo "primary_boot_count=${provisioned_boot_counts[0]}" >> "$GITHUB_OUTPUT"
          echo "secondary_boot_count=${provisioned_boot_counts[1]}" >> "$GITHUB_OUTPUT"

      - name: Test - Feature List (all devices)
        id: feature_list
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          CLI=tools/domes-cli/target/release/domes-cli

          for port in "${PORTS[@]}"; do
            echo "=== Feature list: $port ==="
            # Retry while the runtime serial transport settles after reboot.
            for attempt in 1 2 3; do
              if "$CLI" --port "$port" feature list; then
                break
              fi
              if [ $attempt -lt 3 ]; then
                echo "Attempt $attempt failed, retrying in 5s..."
                sleep 5
              else
                echo "::error::Feature list failed on $port after 3 attempts"
                exit 1
              fi
            done
            echo ""
          done
          echo "Feature list test passed on all devices"

      - name: Test - BLE Discovery and Diagnostics (all devices)
        id: ble
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
          SECONDARY: ${{ steps.detect.outputs.secondary }}
        run: |
          CLI=tools/domes-cli/target/release/domes-cli
          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          declare -A serial_ids=()

          for port in "${PORTS[@]}"; do
            info=$("$CLI" --port "$port" system info)
            printf '%s\n' "$info"
            pod_id=$(awk '/Pod ID:/ {print $3}' <<< "$info")
            if [[ ! "$pod_id" =~ ^[1-9][0-9]*$ ]] || ((pod_id > 255)); then
              echo "::error::BLE identity matching requires a configured pod ID on $port"
              exit 1
            fi
            if [[ -n "${serial_ids[$pod_id]+present}" ]]; then
              echo "::error::Duplicate pod ID $pod_id on $port and ${serial_ids[$pod_id]}"
              exit 1
            fi
            serial_ids[$pod_id]=$port
          done

          scan_output=$("$CLI" devices scan)
          printf '%s\n' "$scan_output"
          mapfile -t ble_addresses < <(awk '/<-- DOMES/ {print $2}' <<< "$scan_output")
          if ((${#ble_addresses[@]} < 2)); then
            echo "::error::Expected at least two DOMES BLE advertisements"
            exit 1
          fi

          declare -A ble_by_id=()
          for address in "${ble_addresses[@]}"; do
            if ! info=$("$CLI" --ble "$address" system info 2>&1); then
              printf '%s\n' "$info"
              continue
            fi
            printf '%s\n' "$info"
            pod_id=$(awk '/Pod ID:/ {print $3}' <<< "$info")
            if [[ ! "$pod_id" =~ ^[1-9][0-9]*$ ]] || ((pod_id > 255)); then
              echo "Ignoring DOMES BLE device with invalid pod ID: $address"
              continue
            fi
            if [[ -z "${serial_ids[$pod_id]+present}" ]]; then
              echo "Ignoring unrelated DOMES BLE device $address (pod ID $pod_id)"
              continue
            fi
            ble_by_id[$pod_id]=$address
            "$CLI" --ble "$address" system self-test
            "$CLI" --ble "$address" system health
          done

          for pod_id in "${!serial_ids[@]}"; do
            if [[ -z "${ble_by_id[$pod_id]+present}" ]]; then
              echo "::error::No BLE device matched serial pod ID $pod_id"
              exit 1
            fi
          done

          secondary_info=$("$CLI" --port "$SECONDARY" system info)
          secondary_id=$(awk '/Pod ID:/ {print $3}' <<< "$secondary_info")
          echo "secondary_address=${ble_by_id[$secondary_id]}" >> "$GITHUB_OUTPUT"

      - name: Test - Invalid OTA Rejection and Recovery
        id: invalid_ota
        env:
          BASELINE_VERSION: ${{ steps.firmware_build.outputs.baseline_version }}
          CI_VERSION: ${{ steps.firmware_build.outputs.ota_version }}
          PRIMARY: ${{ steps.detect.outputs.primary }}
        run: |
          CLI=tools/domes-cli/target/release/domes-cli
          invalid_image="${RUNNER_TEMP:-/tmp}/domes-invalid-${GITHUB_RUN_ID}.bin"
          head -c 4096 firmware/domes/build-ota/domes.bin > "$invalid_image"

          if "$CLI" --port "$PRIMARY" ota flash "$invalid_image" --version "$CI_VERSION"; then
            echo "::error::Device accepted a truncated OTA image"
            exit 1
          fi
          sleep 2
          "$CLI" --port "$PRIMARY" system health
          "$CLI" --port "$PRIMARY" system self-test
          "$CLI" --port "$PRIMARY" feature list

          # A valid image must still be rejected when the host declaration does
          # not exactly match the embedded ESP app descriptor.
          if "$CLI" --port "$PRIMARY" ota flash \
            firmware/domes/build-ota/domes.bin --version "$BASELINE_VERSION"; then
            echo "::error::Device accepted an OTA image with mismatched declared version"
            exit 1
          fi
          mismatch_info=$("$CLI" --port "$PRIMARY" system info)
          printf '%s\n' "$mismatch_info"
          if ! grep -Fq "Firmware:   $BASELINE_VERSION" <<< "$mismatch_info"; then
            echo "::error::Version-mismatch rejection changed the running image"
            exit 1
          fi

      - name: Test - Interrupted OTA Session Recovery
        id: interrupted_ota
        env:
          CI_VERSION: ${{ steps.firmware_build.outputs.ota_version }}
          SECONDARY: ${{ steps.detect.outputs.secondary }}
        run: |
          CLI=tools/domes-cli/target/release/domes-cli
          set +e
          timeout 2s "$CLI" --port "$SECONDARY" ota flash \
            firmware/domes/build-ota/domes.bin --version "$CI_VERSION"
          status=$?
          set -e
          if [[ $status -ne 124 && $status -ne 143 ]]; then
            echo "::error::OTA interruption returned unexpected status $status"
            exit 1
          fi

          echo "Waiting for device-side OTA inactivity cleanup..."
          sleep 20
          "$CLI" --port "$SECONDARY" system health

      - name: Test - Serial OTA (primary device)
        id: serial_ota
        env:
          CI_VERSION: ${{ steps.firmware_build.outputs.ota_version }}
          PRIMARY: ${{ steps.detect.outputs.primary }}
        run: |
          echo "Testing Serial OTA on $PRIMARY..."

          tools/domes-cli/target/release/domes-cli \
            --port "$PRIMARY" \
            ota flash firmware/domes/build-ota/domes.bin \
            --version "$CI_VERSION"

          echo "OTA complete, waiting for reboot..."
          sleep 15

      - name: Test - Post-OTA Verification (primary device)
        id: post_ota
        env:
          BASELINE_BOOT_COUNT: ${{ steps.identity.outputs.primary_boot_count }}
          CI_VERSION: ${{ steps.firmware_build.outputs.ota_version }}
          PRIMARY: ${{ steps.detect.outputs.primary }}
        run: |
          echo "Verifying $PRIMARY responds after OTA..."
          # shellcheck source=/dev/null
          . "$HOME/esp/esp-idf/export.sh"
          CLI=tools/domes-cli/target/release/domes-cli
          info=$("$CLI" --port "$PRIMARY" system info)
          printf '%s\n' "$info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$info"; then
            echo "::error::OTA test image did not boot; expected version $CI_VERSION"
            exit 1
          fi
          first_boot_count=$(awk '/Boot count:/ {print $3}' <<< "$info")
          if [[ ! "$first_boot_count" =~ ^[1-9][0-9]*$ ]] ||
             ((first_boot_count <= BASELINE_BOOT_COUNT)); then
            echo "::error::Serial OTA did not advance the primary boot count"
            exit 1
          fi
          "$CLI" --port "$PRIMARY" system health
          self_test=$("$CLI" --port "$PRIMARY" system self-test)
          printf '%s\n' "$self_test"
          if ! grep -Eq 'Running App.*PASS.*ota_1,' <<< "$self_test"; then
            echo "::error::Accepted serial OTA image is not running from ota_1"
            exit 1
          fi
          "$CLI" --port "$PRIMARY" feature list

          echo "Resetting $PRIMARY again to verify the accepted OTA image is durable..."
          python -m esptool --chip esp32s3 --port "$PRIMARY" run
          sleep 10
          second_boot_info=$("$CLI" --port "$PRIMARY" system info)
          printf '%s\n' "$second_boot_info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$second_boot_info"; then
            echo "::error::OTA test image did not survive a second reboot"
            exit 1
          fi
          second_boot_count=$(awk '/Boot count:/ {print $3}' <<< "$second_boot_info")
          if [[ ! "$second_boot_count" =~ ^[1-9][0-9]*$ ]] ||
             ((second_boot_count <= first_boot_count)); then
            echo "::error::Accepted serial OTA image did not record its second boot"
            exit 1
          fi
          "$CLI" --port "$PRIMARY" system health
          second_self_test=$("$CLI" --port "$PRIMARY" system self-test)
          printf '%s\n' "$second_self_test"
          if ! grep -Eq 'Running App.*PASS.*ota_1,' <<< "$second_self_test"; then
            echo "::error::Accepted serial OTA image changed partitions after reboot"
            exit 1
          fi
          echo "Post-OTA verification passed"

      - name: Test - BLE OTA (secondary device)
        id: ble_ota
        env:
          CI_VERSION: ${{ steps.firmware_build.outputs.ota_version }}
          SECONDARY_BLE: ${{ steps.ble.outputs.secondary_address }}
        run: |
          echo "Testing BLE OTA on $SECONDARY_BLE..."
          tools/domes-cli/target/release/domes-cli \
            --ble "$SECONDARY_BLE" \
            ota flash firmware/domes/build-ota/domes.bin \
            --version "$CI_VERSION"
          echo "BLE OTA complete, waiting for reboot..."
          sleep 15

      - name: Test - Post-BLE-OTA Verification (secondary device)
        id: post_ble_ota
        env:
          BASELINE_BOOT_COUNT: ${{ steps.identity.outputs.secondary_boot_count }}
          CI_VERSION: ${{ steps.firmware_build.outputs.ota_version }}
          SECONDARY: ${{ steps.detect.outputs.secondary }}
          SECONDARY_BLE: ${{ steps.ble.outputs.secondary_address }}
        run: |
          # shellcheck source=/dev/null
          . "$HOME/esp/esp-idf/export.sh"
          CLI=tools/domes-cli/target/release/domes-cli
          info=$("$CLI" --port "$SECONDARY" system info)
          printf '%s\n' "$info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$info"; then
            echo "::error::BLE OTA test image did not boot; expected version $CI_VERSION"
            exit 1
          fi
          first_boot_count=$(awk '/Boot count:/ {print $3}' <<< "$info")
          if [[ ! "$first_boot_count" =~ ^[1-9][0-9]*$ ]] ||
             ((first_boot_count <= BASELINE_BOOT_COUNT)); then
            echo "::error::BLE OTA did not advance the secondary boot count"
            exit 1
          fi
          "$CLI" --port "$SECONDARY" system health
          self_test=$("$CLI" --port "$SECONDARY" system self-test)
          printf '%s\n' "$self_test"
          if ! grep -Eq 'Running App.*PASS.*ota_1,' <<< "$self_test"; then
            echo "::error::Accepted BLE OTA image is not running from ota_1"
            exit 1
          fi

          ble_info=$("$CLI" --ble "$SECONDARY_BLE" system info)
          printf '%s\n' "$ble_info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$ble_info"; then
            echo "::error::Secondary device did not recover BLE after OTA"
            exit 1
          fi

          echo "Resetting $SECONDARY again to verify the accepted BLE OTA image is durable..."
          python -m esptool --chip esp32s3 --port "$SECONDARY" run
          sleep 10
          second_boot_info=$("$CLI" --port "$SECONDARY" system info)
          printf '%s\n' "$second_boot_info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$second_boot_info"; then
            echo "::error::BLE OTA test image did not survive a second reboot"
            exit 1
          fi
          second_boot_count=$(awk '/Boot count:/ {print $3}' <<< "$second_boot_info")
          if [[ ! "$second_boot_count" =~ ^[1-9][0-9]*$ ]] ||
             ((second_boot_count <= first_boot_count)); then
            echo "::error::Accepted BLE OTA image did not record its second boot"
            exit 1
          fi
          "$CLI" --port "$SECONDARY" system health
          second_self_test=$("$CLI" --port "$SECONDARY" system self-test)
          printf '%s\n' "$second_self_test"
          if ! grep -Eq 'Running App.*PASS.*ota_1,' <<< "$second_self_test"; then
            echo "::error::Accepted BLE OTA image changed partitions after reboot"
            exit 1
          fi

          second_boot_ble_info=$("$CLI" --ble "$SECONDARY_BLE" system info)
          printf '%s\n' "$second_boot_ble_info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$second_boot_ble_info"; then
            echo "::error::Secondary device did not recover BLE after a second reboot"
            exit 1
          fi

      - name: Test - Forced OTA Rollback (primary device)
        id: forced_rollback
        env:
          CI_VERSION: ${{ steps.firmware_build.outputs.ota_version }}
          PRIMARY: ${{ steps.detect.outputs.primary }}
          ROLLBACK_VERSION: ${{ steps.firmware_build.outputs.rollback_version }}
        run: |
          # shellcheck source=/dev/null
          . "$HOME/esp/esp-idf/export.sh"
          CLI=tools/domes-cli/target/release/domes-cli

          before_info=$("$CLI" --port "$PRIMARY" system info)
          printf '%s\n' "$before_info"
          before_boot_count=$(awk '/Boot count:/ {print $3}' <<< "$before_info")
          if [[ ! "$before_boot_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Primary reported an invalid boot count before rollback test"
            exit 1
          fi
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$before_info"; then
            echo "::error::Primary is not running the accepted OTA image before rollback test"
            exit 1
          fi
          before_self_test=$("$CLI" --port "$PRIMARY" system self-test)
          printf '%s\n' "$before_self_test"
          if ! grep -Eq 'Running App.*PASS.*ota_1,' <<< "$before_self_test"; then
            echo "::error::Primary is not on ota_1 before rollback test"
            exit 1
          fi

          "$CLI" --port "$PRIMARY" ota flash \
            firmware/domes/build-rollback/domes.bin \
            --version "$ROLLBACK_VERSION"
          echo "Failing image sent; waiting for boot-time self-test and rollback..."
          sleep 20

          after_info=""
          for attempt in 1 2 3 4 5 6; do
            echo "Rollback verification attempt $attempt/6..."
            if after_info=$("$CLI" --port "$PRIMARY" system info 2>&1) &&
               grep -Fq "Firmware:   $CI_VERSION" <<< "$after_info"; then
              break
            fi
            printf '%s\n' "$after_info"
            sleep 5
          done
          printf '%s\n' "$after_info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$after_info"; then
            echo "::error::Bootloader did not roll back to $CI_VERSION"
            exit 1
          fi
          if grep -Fq "Firmware:   $ROLLBACK_VERSION" <<< "$after_info"; then
            echo "::error::Purpose-built failing image was incorrectly accepted"
            exit 1
          fi

          after_boot_count=$(awk '/Boot count:/ {print $3}' <<< "$after_info")
          if [[ ! "$after_boot_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Primary reported an invalid boot count after rollback"
            exit 1
          fi
          if ((after_boot_count < before_boot_count + 2)); then
            echo "::error::Rollback did not produce both failing-image and restored-image boots"
            exit 1
          fi
          "$CLI" --port "$PRIMARY" system health
          after_self_test=$("$CLI" --port "$PRIMARY" system self-test)
          printf '%s\n' "$after_self_test"
          if ! grep -Eq 'Running App.*PASS.*ota_1,' <<< "$after_self_test"; then
            echo "::error::Rollback did not restore the accepted ota_1 partition"
            exit 1
          fi

          echo "Resetting restored image once more..."
          python -m esptool --chip esp32s3 --port "$PRIMARY" run
          sleep 10
          durable_info=$("$CLI" --port "$PRIMARY" system info)
          printf '%s\n' "$durable_info"
          if ! grep -Fq "Firmware:   $CI_VERSION" <<< "$durable_info"; then
            echo "::error::Restored image did not survive a subsequent reboot"
            exit 1
          fi
          durable_boot_count=$(awk '/Boot count:/ {print $3}' <<< "$durable_info")
          if [[ ! "$durable_boot_count" =~ ^[1-9][0-9]*$ ]] ||
             ((durable_boot_count <= after_boot_count)); then
            echo "::error::Restored image did not record its durability reboot"
            exit 1
          fi
          "$CLI" --port "$PRIMARY" system health
          durable_self_test=$("$CLI" --port "$PRIMARY" system self-test)
          printf '%s\n' "$durable_self_test"
          if ! grep -Eq 'Running App.*PASS.*ota_1,' <<< "$durable_self_test"; then
            echo "::error::Restored image changed partitions after durability reboot"
            exit 1
          fi

      - name: Start trace capture
        id: trace_start
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          CLI=tools/domes-cli/target/release/domes-cli

          for port in "${PORTS[@]}"; do
            echo "=== Starting trace capture: $port ==="
            "$CLI" --port "$port" trace clear
            "$CLI" --port "$port" trace start
          done

      - name: Test - Multi-Device Feature List
        id: multi_feature_list
        if: steps.detect.outputs.multi == 'true'
        env:
          PRIMARY: ${{ steps.detect.outputs.primary }}
          SECONDARY: ${{ steps.detect.outputs.secondary }}
        run: |
          echo "Testing multi-device feature list..."
          CLI=tools/domes-cli/target/release/domes-cli

          # Test with multiple --port flags
          "$CLI" \
            --port "$PRIMARY" \
            --port "$SECONDARY" \
            feature list

          echo "Multi-device feature list passed"

      - name: Test - ESP-NOW Communication
        id: espnow
        if: steps.detect.outputs.multi == 'true'
        env:
          PRIMARY: ${{ steps.detect.outputs.primary }}
          SECONDARY: ${{ steps.detect.outputs.secondary }}
        run: |
          echo "Testing ESP-NOW between devices..."
          CLI=tools/domes-cli/target/release/domes-cli

          # Enable ESP-NOW on both devices
          echo "=== Enabling ESP-NOW on both devices ==="
          "$CLI" --port "$PRIMARY" espnow sim-mode on --delay-ms 100 --pad 0
          "$CLI" --port "$SECONDARY" espnow sim-mode on --delay-ms 100 --pad 0
          "$CLI" --port "$PRIMARY" feature enable esp-now
          "$CLI" --port "$SECONDARY" feature enable esp-now

          # Discovery takes 15 seconds; allow the complete ten-round simulated
          # drill to finish before diagnostics and trace collection.
          echo "Waiting for ESP-NOW discovery and simulated drill completion..."
          sleep 35

          # Check ESP-NOW status on both devices
          echo "=== ESP-NOW status: primary ==="
          "$CLI" --port "$PRIMARY" espnow status
          echo ""
          echo "=== ESP-NOW status: secondary ==="
          "$CLI" --port "$SECONDARY" espnow status
          echo ""

          run_benchmark() {
            local port=$1
            local output

            echo "=== ESP-NOW latency benchmark from $port (20 rounds) ==="
            if ! output=$("$CLI" --port "$port" espnow bench --rounds 20 2>&1); then
              printf '%s\n' "$output"
              echo "::error::ESP-NOW benchmark command failed on $port"
              return 1
            fi
            printf '%s\n' "$output"

            if ! grep -Eq 'Rounds:[[:space:]]+20/20 completed \(0 failed\)' <<< "$output" ||
               ! grep -q 'Mean RTT:' <<< "$output"; then
              echo "::error::ESP-NOW benchmark did not complete 20/20 rounds on $port"
              return 1
            fi
          }

          run_benchmark "$PRIMARY"
          run_benchmark "$SECONDARY"
          echo "espnow_bench_passed=true" >> "$GITHUB_OUTPUT"

          echo "ESP-NOW test complete"

      - name: Test - Default Build Omits WiFi Client Control
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          CLI=tools/domes-cli/target/release/domes-cli

          for port in "${PORTS[@]}"; do
            echo "Checking WiFi client capability on $port..."
            if output=$("$CLI" --port "$port" wifi status 2>&1); then
              printf '%s\n' "$output"
              echo "::error::Default firmware unexpectedly exposes runtime WiFi client control"
              exit 1
            fi
            printf '%s\n' "$output"
            if ! grep -q 'does not expose the WiFi feature flag' <<< "$output"; then
              echo "::error::WiFi capability failed for an unexpected reason"
              exit 1
            fi
          done

      - name: Test - Automated Initialization Self-Test (all devices)
        id: self_test
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          CLI=tools/domes-cli/target/release/domes-cli

          for port in "${PORTS[@]}"; do
            echo "=== On-device self-test: $port ==="
            "$CLI" --port "$port" system self-test
            echo ""
          done

      - name: Test - System Health (all devices)
        id: system_health
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          CLI=tools/domes-cli/target/release/domes-cli

          for port in "${PORTS[@]}"; do
            echo "=== System health: $port ==="
            "$CLI" --port "$port" system health
            echo ""
          done

      - name: Collect traces (all devices)
        id: traces
        if: ${{ always() && steps.trace_start.outcome == 'success' }}
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          CLI=tools/domes-cli/target/release/domes-cli
          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          TRACE_DIR="${RUNNER_TEMP:-/tmp}/hw-test-traces-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$TRACE_DIR"

          TRACE_FILES=()
          POD_ARGS=()

          for i in "${!PORTS[@]}"; do
            port="${PORTS[$i]}"
            outfile="$TRACE_DIR/trace-pod${i}.json"
            echo "=== Dumping traces from $port ==="
            "$CLI" --port "$port" trace stop
            if ! dump_output=$("$CLI" --port "$port" trace dump \
              --output "$outfile" \
              --names tools/trace/trace_names.json 2>&1); then
              printf '%s\n' "$dump_output"
              echo "::error::Trace dump failed on $port"
              exit 1
            fi
            printf '%s\n' "$dump_output"

            if ! grep -Eq 'Dump complete: [1-9][0-9]* events' <<< "$dump_output"; then
              echo "::error::Trace dump from $port contained no events"
              exit 1
            fi
            if grep -Eq 'Dropped: [1-9][0-9]* events' <<< "$dump_output"; then
              echo "::error::Trace capture from $port dropped events"
              exit 1
            fi
            if [[ ! -s "$outfile" ]]; then
              echo "::error::Trace output is missing or empty: $outfile"
              exit 1
            fi

            echo "Trace saved: $outfile"
            TRACE_FILES+=("$outfile")
            POD_ARGS+=("--pod" "$outfile" "--pod-name" "Pod $i ($port)")
          done

          # Merge traces if we have multiple pod dumps
          if ((${#TRACE_FILES[@]} >= 2)); then
            echo "=== Merging ${#TRACE_FILES[@]} pod traces ==="
            python3 tools/trace/trace_merge.py \
              "${POD_ARGS[@]}" \
              --names tools/trace/trace_names.json \
              --align zero \
              -o "$TRACE_DIR/merged-trace.json"
            test -s "$TRACE_DIR/merged-trace.json"
            python3 - "$TRACE_DIR/merged-trace.json" <<'PY'
          import collections
          import json
          import sys

          events = json.load(open(sys.argv[1], encoding="utf-8"))["traceEvents"]
          counts = collections.Counter(event.get("name") for event in events)
          required = {
              "Game.TouchHit": 10,
              "EspNow.SendTouchEvent": 5,
              "EspNow.RxTouchEvent": 5,
              "EspNow.DrillComplete": 1,
          }
          missing = {
              name: (counts[name], minimum)
              for name, minimum in required.items()
              if counts[name] < minimum
          }
          if missing:
              raise SystemExit(f"incomplete simulated two-pod drill trace: {missing}")
          PY
            echo "Merged trace: $TRACE_DIR/merged-trace.json"
          fi

          echo "trace_dir=$TRACE_DIR" >> "$GITHUB_OUTPUT"
          echo "has_traces=true" >> "$GITHUB_OUTPUT"

      - name: Upload trace artifacts
        if: ${{ always() && steps.traces.outputs.has_traces == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hw-test-traces-${{ github.sha }}
          path: ${{ steps.traces.outputs.trace_dir }}/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore deterministic idle state
        id: cleanup
        if: always()
        env:
          PORT_LIST: ${{ steps.detect.outputs.ports }}
        run: |
          CLI=tools/domes-cli/target/release/domes-cli
          if [[ -z "$PORT_LIST" || ! -x "$CLI" ]]; then
            echo "Hardware was not initialized; cleanup is not required."
            exit 0
          fi

          IFS=',' read -ra PORTS <<< "$PORT_LIST"
          cleanup_failed=0
          for port in "${PORTS[@]}"; do
            echo "=== Restoring idle state: $port ==="
            for command in \
              'trace stop' \
              'espnow sim-mode off' \
              'feature disable esp-now' \
              'led off' \
              'system set-mode idle'; do
              read -ra args <<< "$command"
              if ! "$CLI" --port "$port" "${args[@]}"; then
                echo "::error::Cleanup command failed on $port: $command"
                cleanup_failed=1
              fi
            done
          done

          exit "$cleanup_failed"

      - name: Summary
        if: always()
        env:
          CLI_BUILD_OUTCOME: ${{ steps.cli_build.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          DEVICE_COUNT: ${{ steps.detect.outputs.count }}
          ESPNOW_OUTCOME: ${{ steps.espnow.outcome }}
          FEATURE_LIST_OUTCOME: ${{ steps.feature_list.outcome }}
          FIRMWARE_BUILD_OUTCOME: ${{ steps.firmware_build.outcome }}
          FLASH_OUTCOME: ${{ steps.flash.outcome }}
          FORCED_ROLLBACK_OUTCOME: ${{ steps.forced_rollback.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          INTERRUPTED_OTA_OUTCOME: ${{ steps.interrupted_ota.outcome }}
          INVALID_OTA_OUTCOME: ${{ steps.invalid_ota.outcome }}
          IS_MULTI: ${{ steps.detect.outputs.multi }}
          MULTI_FEATURE_OUTCOME: ${{ steps.multi_feature_list.outcome }}
          PORT_LIST: ${{ steps.detect.outputs.ports }}
          POST_OTA_OUTCOME: ${{ steps.post_ota.outcome }}
          POST_BLE_OTA_OUTCOME: ${{ steps.post_ble_ota.outcome }}
          SERIAL_OTA_OUTCOME: ${{ steps.serial_ota.outcome }}
          BLE_OUTCOME: ${{ steps.ble.outcome }}
          BLE_OTA_OUTCOME: ${{ steps.ble_ota.outcome }}
          SELF_TEST_OUTCOME: ${{ steps.self_test.outcome }}
          SUMMARY_BRANCH: ${{ github.head_ref || github.ref_name }}
          SYSTEM_HEALTH_OUTCOME: ${{ steps.system_health.outcome }}
          TRACE_OUTCOME: ${{ steps.traces.outcome }}
          TRACE_DIR: ${{ steps.traces.outputs.trace_dir }}
        run: |
          exec >> "$GITHUB_STEP_SUMMARY"
          echo "## Hardware Test Results"
          echo ""
          echo "| Property | Value |"
          echo "|----------|-------|"
          echo "| Devices | $DEVICE_COUNT ($PORT_LIST) |"
          echo "| Multi-device | $IS_MULTI |"
          echo "| Commit | \`$GITHUB_SHA\` |"
          echo "| Branch | $SUMMARY_BRANCH |"
          echo ""
          echo "### Test Results"
          report() {
            if [ "$2" = "success" ]; then
              echo "- [x] $1"
            else
              echo "- [ ] $1 ($2)"
            fi
          }
          report "Firmware build" "$FIRMWARE_BUILD_OUTCOME"
          report "CLI build" "$CLI_BUILD_OUTCOME"
          report "Flash all devices" "$FLASH_OUTCOME"
          report "Provision deterministic pod identities" "$IDENTITY_OUTCOME"
          report "Feature list (all devices)" "$FEATURE_LIST_OUTCOME"
          report "BLE discovery and diagnostics (all devices)" "$BLE_OUTCOME"
          report "Invalid OTA rejection and recovery" "$INVALID_OTA_OUTCOME"
          report "Interrupted OTA session recovery" "$INTERRUPTED_OTA_OUTCOME"
          report "Serial OTA (primary)" "$SERIAL_OTA_OUTCOME"
          report "Post-OTA verification" "$POST_OTA_OUTCOME"
          report "BLE OTA (secondary)" "$BLE_OTA_OUTCOME"
          report "Post-BLE-OTA verification" "$POST_BLE_OTA_OUTCOME"
          report "Forced failed-self-test rollback" "$FORCED_ROLLBACK_OUTCOME"
          report "Automated initialization self-test" "$SELF_TEST_OUTCOME"
          if [ "$IS_MULTI" = "true" ]; then
            report "Multi-device feature list" "$MULTI_FEATURE_OUTCOME"
            report "ESP-NOW communication" "$ESPNOW_OUTCOME"
          fi
          report "System health check" "$SYSTEM_HEALTH_OUTCOME"
          report "Non-empty trace collection" "$TRACE_OUTCOME"
          report "Restore idle state" "$CLEANUP_OUTCOME"
          echo ""
          echo "Physical LED, touch, haptic, and audio output still require human confirmation."
          echo ""
          echo "### Trace Artifacts"
          if [ -n "$TRACE_DIR" ] && compgen -G "$TRACE_DIR/*.json" > /dev/null; then
            for f in "$TRACE_DIR"/*.json; do
              SIZE=$(stat -c%s "$f" 2>/dev/null || echo "0")
              echo "- \`$(basename "$f")\` (${SIZE} bytes)"
            done
            echo ""
            echo "Download trace files from the **Artifacts** section and open at [ui.perfetto.dev](https://ui.perfetto.dev)"
          else
            echo "No traces collected (buffer empty or tracing not initialized)"
          fi
