name: Software CI

on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: software-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v5.4.4@sha256:8d1846f61ff8db00ba6530501f90bf43604d923072a616c806fef8e85a88ed82

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Verify firmware checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$IDF_PATH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check generated firmware bindings
        run: |
          . "$IDF_PATH/export.sh"
          GENERATOR_PYTHONPATH="${RUNNER_TEMP:-/tmp}/nanopb-generator"
          python -m pip install --disable-pip-version-check --require-hashes \
            --target "$GENERATOR_PYTHONPATH" \
            -r firmware/third_party/nanopb/extra/requirements_lock.txt
          PYTHONPATH="$GENERATOR_PYTHONPATH${PYTHONPATH:+:$PYTHONPATH}" \
            tools/generate_protocols.sh --check nanopb

      - name: Build physical firmware
        working-directory: firmware/domes
        run: |
          . "$IDF_PATH/export.sh"
          actual_idf_version=$(idf.py --version)
          echo "$actual_idf_version"
          if [[ "$actual_idf_version" != "ESP-IDF v5.4.4" ]]; then
            echo "::error::Expected ESP-IDF v5.4.4, found $actual_idf_version"
            exit 1
          fi
          sdkconfig_path="${RUNNER_TEMP:-/tmp}/domes-ci-sdkconfig"
          rm -rf build
          rm -f "$sdkconfig_path"
          idf.py -B build \
            -D "IDF_TARGET=esp32s3" \
            -D "SDKCONFIG=$sdkconfig_path" \
            build
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("build/config/sdkconfig.json").read_text())
          if config.get("BOOTLOADER_APP_ROLLBACK_ENABLE") is not True:
              raise SystemExit("firmware build does not enable bootloader app rollback")
          PY
          if ! lock_status=$(git status --porcelain -- dependencies.lock); then
            echo "::error::Could not inspect firmware/domes/dependencies.lock"
            exit 1
          fi
          if [[ -n "$lock_status" ]]; then
            echo "::error::ESP-IDF rewrote firmware/domes/dependencies.lock"
            git diff -- dependencies.lock
            exit 1
          fi

      - name: Build QEMU firmware profile
        working-directory: firmware/domes
        run: |
          . "$IDF_PATH/export.sh"
          qemu_sdkconfig_path="${RUNNER_TEMP:-/tmp}/domes-qemu-ci-sdkconfig"
          rm -rf build-qemu
          rm -f "$qemu_sdkconfig_path"
          idf.py -B build-qemu \
            -D "IDF_TARGET=esp32s3" \
            -D "SDKCONFIG=$qemu_sdkconfig_path" \
            -D "SDKCONFIG_DEFAULTS=$PWD/sdkconfig.qemu.defaults" \
            build
          if ! lock_status=$(git status --porcelain -- dependencies.lock); then
            echo "::error::Could not inspect firmware/domes/dependencies.lock"
            exit 1
          fi
          if [[ -n "$lock_status" ]]; then
            echo "::error::ESP-IDF rewrote firmware/domes/dependencies.lock"
            git diff -- dependencies.lock
            exit 1
          fi

      - name: Validate runtime profiles and source closure
        run: |
          . "$IDF_PATH/export.sh"
          python tools/simulation/qemu_runtime.py validate-builds \
            --physical-build firmware/domes/build \
            --qemu-build firmware/domes/build-qemu
          python tools/ci/verify_firmware_provenance.py \
            --repository . \
            --expected-head "$GITHUB_SHA" \
            --build firmware/domes/build \
            --build firmware/domes/build-qemu

      - name: Check binary size
        run: |
          size=$(stat -c%s firmware/domes/build/domes.bin)
          max_size=1966080
          echo "Binary size: $size / $max_size bytes"
          if ((size > max_size)); then
            echo "::error::Binary exceeds OTA partition size ($size > $max_size bytes)"
            exit 1
          fi

      - name: Package and validate release images
        working-directory: firmware/domes/build
        run: |
          . "$IDF_PATH/export.sh"
          release_dir="$PWD/release"
          mkdir -p "$release_dir"

          python -m esptool --chip esp32s3 merge_bin \
            -o "$release_dir/domes-factory.bin" @flash_args
          python -m esptool --chip esp32s3 image_info domes.bin
          python -m esptool --chip esp32s3 image_info "$release_dir/domes-factory.bin"

          cp domes.bin "$release_dir/domes.bin"
          cp domes.elf "$release_dir/domes.elf"
          cp project_description.json "$release_dir/project_description.json"
          cp domes-fidelity-manifest.json "$release_dir/domes-fidelity-manifest.json"
          cp bootloader/bootloader.bin "$release_dir/bootloader.bin"
          cp partition_table/partition-table.bin "$release_dir/partition-table.bin"
          cp ota_data_initial.bin "$release_dir/ota_data_initial.bin"
          sed \
            -e 's#bootloader/bootloader.bin#bootloader.bin#' \
            -e 's#partition_table/partition-table.bin#partition-table.bin#' \
            flash_args > "$release_dir/flash_args"

          cd "$release_dir"
          test -s domes.bin
          test -s domes.elf
          test -s project_description.json
          test -s domes-fidelity-manifest.json
          test -s domes-factory.bin
          test -s bootloader.bin
          test -s partition-table.bin
          test -s ota_data_initial.bin
          sha256sum \
            domes.bin \
            domes.elf \
            project_description.json \
            domes-fidelity-manifest.json \
            domes-factory.bin \
            bootloader.bin \
            partition-table.bin \
            ota_data_initial.bin \
            flash_args > SHA256SUMS
          sha256sum --check SHA256SUMS
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".").resolve()
          metadata = json.loads((root / "project_description.json").read_text())
          metadata_elf = (root / metadata.get("app_elf", "")).resolve()
          if metadata_elf != root / "domes.elf" or not metadata_elf.is_file():
              raise SystemExit(f"project metadata does not resolve to packaged ELF: {metadata_elf}")
          PY
          python "$GITHUB_WORKSPACE/tools/ci/verify_firmware_provenance.py" \
            --repository "$GITHUB_WORKSPACE" \
            --expected-head "$GITHUB_SHA" \
            --build .

      - name: Upload firmware package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domes-firmware-${{ github.sha }}
          path: firmware/domes/build/release/
          if-no-files-found: error
          retention-days: 30

  qemu-runtime:
    name: Execute ESP32-S3 QEMU Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: espressif/idf:v5.4.4@sha256:8d1846f61ff8db00ba6530501f90bf43604d923072a616c806fef8e85a88ed82

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Execute deterministic production runtime
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$IDF_PATH"
          . "$IDF_PATH/export.sh"
          artifact_root="$GITHUB_WORKSPACE/.artifacts/qemu-ci"
          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"
          python3 tools/simulation/qemu_runtime.py run \
            --build-dir "$artifact_root/build" \
            --artifact-dir "$artifact_root/runtime" \
            --runs 100 \
            --timeout 15 \
            2>&1 | tee "$artifact_root/runner.log"

          python3 tools/simulation/qemu_runtime.py verify-ci-report \
            --report "$artifact_root/runtime/runtime-report.json" \
            --expected-head "$GITHUB_SHA"

      - name: Upload QEMU failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domes-qemu-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/qemu-ci/
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Build and run tests
        run: |
          cmake \
            -S firmware/test_app \
            -B firmware/test_app/build \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build firmware/test_app/build -j"$(nproc)"
          ctest \
            --test-dir firmware/test_app/build \
            --output-on-failure \
            --no-tests=error

  cli-build:
    name: Build CLI Tool
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev \
            libudev-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Enforce repository policy hooks
        run: |
          python -m pip install --disable-pip-version-check pre-commit==4.6.1
          pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Check CLI formatting
        working-directory: tools/domes-cli
        run: cargo fmt --check

      - name: Lint CLI
        working-directory: tools/domes-cli
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build CLI
        working-directory: tools/domes-cli
        run: |
          cargo build --locked
          cargo build --locked --release

      - name: Run CLI tests
        working-directory: tools/domes-cli
        run: cargo test --locked --all-targets --all-features

  host-tooling:
    name: Test Host Tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install workflow lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Test Python tooling
        run: |
          python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
          python3 -m unittest discover -s tools/doctor -p 'test_*.py' -v
          python3 -m unittest discover -s tools/docs -p 'test_*.py' -v
          python3 -m unittest discover -s tools/verify -p 'test_*.py' -v
          python3 -m unittest discover -s tools/simulation -p 'test_*.py' -v
          python3 tools/docs/check_markdown_links.py
          python3 -m unittest discover -s tools/trace -p 'test_*.py' -v
          python3 tools/trace/generate_trace_names.py --check
          mapfile -d '' python_files < <(git ls-files -z '*.py')
          python3 -m py_compile "${python_files[@]}"

      - name: Check shell entry points
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -color

  flutter:
    name: Flutter
    uses: ./.github/workflows/flutter-ci.yml

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [firmware-build, qemu-runtime, unit-tests, cli-build, host-tooling, flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Verify required jobs
        env:
          CLI_RESULT: ${{ needs.cli-build.result }}
          FIRMWARE_RESULT: ${{ needs.firmware-build.result }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
          HOST_TOOLING_RESULT: ${{ needs.host-tooling.result }}
          QEMU_RUNTIME_RESULT: ${{ needs.qemu-runtime.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-tests.result }}
        run: |
          failed=0
          for result in \
            "$FIRMWARE_RESULT" \
            "$QEMU_RUNTIME_RESULT" \
            "$UNIT_TEST_RESULT" \
            "$CLI_RESULT" \
            "$HOST_TOOLING_RESULT" \
            "$FLUTTER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if ((failed)); then
            echo "::error::One or more required CI jobs did not succeed"
            exit 1
          fi
