name: Flutter Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze And Test Flutter App
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler

      - name: Install Flutter
        run: tools/ci/install_flutter.sh

      - name: Install dependencies
        working-directory: ios/domes_app
        run: flutter pub get --enforce-lockfile

      - name: Check generated Dart bindings
        run: |
          dart pub global activate protoc_plugin 25.0.0
          tools/generate_protocols.sh --check dart

      - name: Analyze
        working-directory: ios/domes_app
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        working-directory: ios/domes_app
        run: flutter test

      - name: Build Linux release
        working-directory: ios/domes_app
        run: flutter build linux --release

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Flutter
        run: tools/ci/install_flutter.sh

      - name: Install dependencies
        working-directory: ios/domes_app
        run: flutter pub get --enforce-lockfile

      - name: Build without code signing
        working-directory: ios/domes_app
        run: flutter build ios --release --no-codesign

      - name: Check iOS generated-tree drift
        run: |
          drift=$(git status --porcelain --untracked-files=all -- ios/domes_app/ios)
          if [[ -n "$drift" ]]; then
            echo "::error::The iOS build changed the checked-out project tree"
            printf '%s\n' "$drift"
            git diff -- ios/domes_app/ios
            while IFS= read -r -d '' package_lock; do
              echo "::group::$package_lock"
              cat "$package_lock"
              echo "::endgroup::"
            done < <(
              find ios/domes_app/ios \
                -path '*/xcshareddata/swiftpm/Package.resolved' \
                -type f \
                -print0
            )
            exit 1
          fi
