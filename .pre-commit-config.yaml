# Pre-commit hooks for DOMES project
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# See https://pre-commit.com for more information

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.patch$'
      - id: end-of-file-fixer
        exclude: '\.patch$|\.bin$|\.pdf$'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: '\.pdf$|\.png$|\.zip$|\.epro$'
      - id: check-merge-conflict
      - id: check-case-conflict

  # C/C++ formatting with clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: f4d7745e17a28aad7eed2f4874ca8d1568c11c4c  # frozen: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        files: ^firmware/
        exclude: '\.pb\.(c|h)$|third_party/'

  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # frozen: 26.5.1
    hooks:
      - id: black
        language_version: python3
        files: ^tools/

  - repo: https://github.com/pycqa/isort
    rev: a333737ed43df02b18e6c95477ea1b285b3de15a  # frozen: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^tools/

  # Rust formatting (for domes-cli)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path tools/domes-cli/Cargo.toml -- --check
        language: system
        pass_filenames: false
        files: '^tools/domes-cli/.*\.rs$'
      - id: cargo-check
        name: cargo check
        entry: cargo check --locked --manifest-path tools/domes-cli/Cargo.toml
        language: system
        pass_filenames: false
        files: '^tools/domes-cli/(Cargo\.(toml|lock)|.*\.rs)$'

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        language_version: 24.18.1
        args: ['--fix', '--disable', 'MD013', 'MD028', 'MD033', 'MD036', 'MD040', 'MD041', 'MD060', '--']
        exclude: '(^|/)(CHANGELOG\.md|research/(AI_DEVELOPMENT_RECOMMENDATIONS\.md|architecture/.*|archive/.*))$'
